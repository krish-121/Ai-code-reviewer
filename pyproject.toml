[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-review"
version = "0.1.0"
description = "Context-aware AI code review & verification platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sentinel contributors" }]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "httpx>=0.27",
  "sqlalchemy>=2.0.30",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
analyzers = ["ruff>=0.5", "mypy>=1.10", "bandit>=1.7"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
sentinel = "sentinel.apps.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentinel.analysis.ast" = ["*.js"]
"sentinel.apps.api" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "cases", ".*", "node_modules", "__pycache__"]
addopts = "-q --strict-markers"
markers = [
  "postgres: requires SENTINEL_TEST_DATABASE_URL pointing at PostgreSQL",
  "docker: requires a running Docker daemon and the sandbox image",
  "node: requires node + the typescript package",
]
filterwarnings = ["ignore::DeprecationWarning:click.*"]

[tool.coverage.run]
source = ["sentinel"]
branch = true
omit = ["src/sentinel/apps/api/static/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.$",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["demo", "tests/golden/cases", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4", "PIE", "RET"]
ignore = [
  "S101",   # assert is fine in tests
  "S603",   # subprocess without shell=True is the safe form; inputs are controlled
  "S607",   # tools are resolved from PATH on purpose
  "RUF012",
  "RUF001", "RUF002", "RUF003",  # typographic characters (×, →, —) are intentional
  "PT018",  # compound asserts read fine
  "SIM905", # word lists read better as split strings
  "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S608", "E501"]
"src/sentinel/analysis/static/builtin_security.py" = ["S105"]
"src/sentinel/analysis/diff/secrets.py" = ["S105"]
"src/sentinel/apps/cli/main.py" = ["E501"]  # typer Annotated signatures

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["sentinel"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml", "jwt", "jwt.*", "psycopg", "uvicorn"]
ignore_missing_imports = true
