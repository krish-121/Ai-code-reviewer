# Every push and pull request runs every quality gate (spec §53). Nothing merges red.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python — lint, types, tests, coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-retries 10
    env:
      # Store, queue, API and end-to-end tests also run against PostgreSQL.
      SENTINEL_TEST_DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -c requirements.lock -e ".[dev,postgres,analyzers]"
          npm ci --prefix tools/analyzers --omit=dev --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tools/analyzers/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$GITHUB_WORKSPACE/tools/analyzers/node_modules" >> "$GITHUB_ENV"
      - name: Build the fix sandbox image (enables the Docker sandbox tests)
        run: docker build -f Dockerfile.sandbox -t sentinel-sandbox:latest .
      - name: Ruff
        run: |
          ruff check src tests scripts tools/opencode_bridge
          ruff format --check src tests scripts tools/opencode_bridge
      - name: mypy (strict)
        run: |
          mypy
          mypy --strict tools/opencode_bridge
      - name: Public demo tooling types
        run: MYPYPATH=demo:scripts mypy --strict scripts/demo_support.py scripts/seed_demo.py scripts/serve_demo.py
      - name: Tests with coverage (≥80% overall)
        run: pytest --cov=sentinel --cov-report=term --cov-report=xml --cov-fail-under=80
      - name: Core coverage (≥90%)
        run: coverage report --include="*/sentinel/core/*" --fail-under=90
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  web:
    name: Web UI — lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Typecheck + Prettier
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: Compose deployment and Docker validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Full isolated Compose acceptance
        run: python scripts/verify_compose.py --output /tmp/sentinel-compose-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-evidence
          path: /tmp/sentinel-compose-evidence
