# Optional: docker compose -f docker-compose.yml -f docker-compose.opencode.yml up --build
# Set SENTINEL_OPENCODE_TOKEN to a random local secret (not a Gemini/API key).
services:
  opencode-bridge:
    image: sentinel-opencode-bridge:1.19.3
    build: ./tools/opencode_bridge
    environment:
      SENTINEL_OPENCODE_TOKEN: ${SENTINEL_OPENCODE_TOKEN:?Set a separate local bridge token}
    expose: ["4097"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-I", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4097/health', timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    environment: &fallback
      SENTINEL_PROVIDER: gemini
      SENTINEL_FREE_FALLBACK: "1"
      SENTINEL_OPENCODE_URL: http://opencode-bridge:4097
      SENTINEL_OPENCODE_TOKEN: ${SENTINEL_OPENCODE_TOKEN:?Set a separate local bridge token}
    depends_on: &bridge-health
      opencode-bridge:
        condition: service_healthy

  worker:
    environment: *fallback
    depends_on: *bridge-health

  validation-worker:
    environment: *fallback
    depends_on: *bridge-health
